# PR body format: flag descriptions that render badly on GitHub — prose
# hard-wrapped mid-sentence, list items broken onto a second line, collapsed
# tables, a mermaid diagram the parser rejects. A body is rendered in comment
# mode, where one newline becomes a <br>, so an editor-wrapped paragraph
# arrives as a ragged column that the author never sees.
#
# Deliberately advisory, and not in any required-context list: on the action's
# calibration corpus a red result is a signal for the author to fix or dismiss,
# not a gate. Making it required would redden the trunk over descriptions
# nobody intends to rewrite.
#
# `edited` re-runs the check once the author fixes the body; without it the
# original red result would stand.
name: pr-body-format

on:
  pull_request:
    # No `branches:` filter: a stacked pull request targets the branch below
    # it, and filtering on main would leave every layer without this check.
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-body-format:
    runs-on: ubuntu-latest
    steps:
      # No actions/checkout: the body and its diagrams are read through the
      # GitHub API, and this repository ships no .vale.ini, so the prose step
      # has no rules to read. Without a checkout it reports "skipped, no rules
      # found" out loud and the job stays green.
      - uses: elecnix/gh-pr-body-action@08c74dc0736abe295e90d6363abd55cf7ea63ef3  # v1.2.1
